summary = "Paired change (branch feat/known-apps-claude-chatgpt in both repositories). In the private submodule: two entries are added to the list of known apps, https://claude.ai/oauth/mcp-oauth-client-metadata as \"Claude (Anthropic)\" and https://chatgpt.com/oauth/client.json as \"ChatGPT (OpenAI)\", matched as before on the whole client id as one exact string; the evidence (the vendors' documentation and published documents, checked 2026-11-26, listed by the owner's decision before either has connected) is written beside the entries and in ee/docs/oauth-server.md, whose runbook now confirms the entries after the first real connection instead of adding them then; and the read-only smoke check gains a check that /llms.txt and /integrations/mcp.md on the apex are served as text. The private branch also carries the commit that advances the marketing submodule pointer to the merged llms.txt and Markdown pages. In this repository: tests only (the two addresses are known; every other address on those hosts, the per-connection ChatGPT address and Claude's confidential-client address included, stays unverified; the issuer is returned on both answers that send a browser back to an application and equals the issuer in both metadata documents), the two browser specs, docs/TODO.md and the changelog. This pull request does not move the ee pointer: so it carries no deploy obligation of its own (tests and documents only). The listed names reach production only when a later change moves the pointer and the Enterprise app is deployed, with the owner's approval; that pointer change must declare the Enterprise deploy in its own contract. OAuth sign-in stays switched off. Nothing changes in the Community Edition."
