title = "Name people by id and display name in AI results, and refuse API keys whose owner no longer belongs"
summary = "Enterprise code in the private ee submodule: MCP and /api/ai results give people as id and display name instead of the account record or an email address, and an API key is refused when its owner was anonymised or deleted, the organisation was deleted, or the owner is no longer a member. The public repository gets the tests, the changelog entry and the tracker update; the ee pointer is advanced separately after the private pull request merges. This pull request changes tests and documents only, so it carries no artifact obligation; the pull request that advances the ee pointer declares the Enterprise deploy."
change_type = "bugfix"
