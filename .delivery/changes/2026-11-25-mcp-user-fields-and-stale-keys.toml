schema_version = 1
id = "2026-11-25-mcp-user-fields-and-stale-keys"
title = "Name people by id and display name in AI results, and refuse API keys whose owner no longer belongs"
summary = "Enterprise code in the private ee submodule: MCP and /api/ai results give people as id and display name instead of the account record or an email address, and an API key is refused when its owner was anonymised or deleted, the organisation was deleted, or the owner is no longer a member. The public repository gets the tests, the changelog entry, the tracker update and the ee pointer. No public application code changes, so a Community release is not needed for it; it is declared a candidate only because the pointer counts as shared core. The Enterprise deploy carries the change. Before that deploy, count the API keys whose owner has no membership row for the key's organisation (query in docs/TODO.md): those keys stop working."
change_type = "bugfix"
surfaces = ["shared_core"]

[artifacts]
enterprise_app = "required"
community_release = "candidate"
community_release_level = "patch"
marketing_website = "none"
