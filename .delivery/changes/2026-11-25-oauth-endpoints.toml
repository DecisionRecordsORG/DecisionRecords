schema_version = 1
id = "2026-11-25-oauth-endpoints"
title = "OAuth endpoints, consent page and connected-apps lists for the MCP server, behind a system switch that is off"
summary = "Wires the Enterprise OAuth authorization server into the app. Public code: app.py hands the MCP endpoint's bearer credential, challenge and rate limit to the Enterprise module (API keys behave as before), lets the Enterprise module answer the OAuth metadata addresses while the switch is on, adds /.well-known/openid-configuration as a JSON 404, and sends frame-ancestors 'none' and X-Frame-Options DENY on /oauth/ and /api/oauth/ in every edition; security.py exempts /oauth/token and /oauth/revoke from the session CSRF check because they never read the session. The endpoints themselves are Enterprise (ee/backend/oauth_server in the private submodule) and answer 404 until the system setting oauth_server_enabled is turned on, which nothing in this change does. Startup migration 2.8.0 adds two nullable columns to oauth_tokens, and retention.py deletes unanswered consent requests five minutes after they expire. Community behaviour changes in small ways: the openid-configuration address answers 404 JSON instead of the web app's HTML, the two path prefixes get the stricter framing headers, the session's CSRF token header is no longer sent on the metadata, token, revoke and MCP endpoints, and the migration runs. Enterprise behaviour changes for API keys in one way that is not behind the switch: a key is refused on the MCP endpoint while its organisation's External AI access setting is off. Web app side, added on the same work (branch feat/oauth-consent-ui): the route /oauth/consent (the component is Enterprise, with a Community stub), a hook in the app shell that leads a signed-in person back to a pending consent request with a full page load (Enterprise only; it asks nothing in the Community Edition), no navigation bar or cookie notice on that page, the connected-apps card on the profile page and in organisation settings (a stub that shows nothing in the Community Edition), dev-server proxy entries for the OAuth endpoints, a test-only endpoint that prepares OAuth for end-to-end tests, and the end-to-end tests. In the private submodule: the consent and connected-apps components, and a rule that OAuth cannot be switched on unless the resource and issuer addresses are configured and https."
change_type = "feature"
surfaces = ["shared_core"]

[artifacts]
enterprise_app = "required"
community_release = "candidate"
community_release_level = "minor"
marketing_website = "none"
