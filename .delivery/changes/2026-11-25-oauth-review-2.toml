schema_version = 1
id = "2026-11-25-oauth-review-2"
title = "Fixes from the second security review of the OAuth authorization server for the MCP endpoint"
summary = "Six findings and three small points, each with a regression test. OAuth stays switched off; nothing here turns it on. Public code: app.py refuses a JSON-RPC batch of more than 50 messages on /api/mcp with HTTP 400 and a JSON-RPC Invalid Request error before any of it runs (the route is Enterprise only, and the limit applies to API keys as well as OAuth tokens; before, a batch could be of any size), and the test-only OAuth set-up endpoint gains an option to switch the installation's external API access off. e2e/playwright.config.ts starts the local test backend single-threaded, as the private CI does. Tests, docs/TODO.md and the changelog. Private submodule (same-named branch fix/oauth-review-2): the installation's External API Access switch gates OAuth at consent and on every MCP request with an OAuth token and is listed on the super admin switch page (API keys on MCP are deliberately left as they are; recorded in docs/TODO.md for the owner); at most two client-document fetches run at a time per worker and a failed fetch is remembered for 60 seconds per client; the installation-wide cap on waiting consent requests evicts the oldest unopened request instead of refusing, and /oauth/authorize counts IPv6 callers per /48 as well as per /64; known apps are matched by exact client id (one entry, Claude Code) instead of by host; a used authorization code replayed without its redirect URI and PKCE verifier no longer ends the connection; tenant_id in the consent decision is bounded; the connected-apps API returns the client id. The private CI job timeout goes from 30 to 45 minutes. Community behaviour does not change: /api/mcp answers 404 there and the OAuth routes do not exist. No schema change and no migration."
change_type = "bugfix"
surfaces = ["shared_core"]

[artifacts]
enterprise_app = "required"
community_release = "candidate"
community_release_level = "patch"
marketing_website = "none"
