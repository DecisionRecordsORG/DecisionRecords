name: Deploy Public Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/angular.json'
      - 'frontend/prerender-routes.txt'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/deploy-public-website.yml'

concurrency:
  group: production-website
  cancel-in-progress: false

jobs:
  preflight:
    name: Public Website Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Community/Enterprise boundary
        run: python scripts/check_ce_boundary.py

      - name: Check open-source artifact boundary
        run: python scripts/check_public_artifacts.py --mode all

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build public website
        run: |
          cd frontend
          npm ci
          npx tsc -p tsconfig.app.ce.json --noEmit
          npm run build -- --configuration=community --progress=false

      - name: Upload public website artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-website
          path: frontend/dist/frontend/browser/
          retention-days: 7

  deploy:
    name: Deploy Static Website
    runs-on: ubuntu-latest
    needs: preflight
    environment: production-website
    permissions:
      contents: read

    steps:
      - name: Download public website artifact
        uses: actions/download-artifact@v4
        with:
          name: public-website
          path: public-website

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: public-website
          skip_app_build: true
