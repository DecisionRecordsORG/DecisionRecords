# Release workflow
# Triggered on version tags (v*.*.*)
# Builds and publishes Docker images to GitHub Container Registry

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: decisionrecordsorg/decisionrecords

jobs:
  validate:
    name: Validate Community Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Validate release metadata
        run: python scripts/check_release_metadata.py --tag "${GITHUB_REF_NAME}"

      - name: Check open-source artifact boundary
        run: python scripts/check_public_artifacts.py --mode all

      - name: Check Community/Enterprise boundary
        run: python scripts/check_ce_boundary.py

      - name: Run backend tests
        env:
          DECISION_RECORDS_EDITION: community
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: test-secret-key
          FLASK_ENV: testing
          AZURE_KEYVAULT_URL: ""
        run: python -m pytest tests/ -q --tb=short

      - name: Typecheck frontend
        run: |
          cd frontend
          npx tsc -p tsconfig.app.ce.json --noEmit

      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration=community --progress=false

  release:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.community
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Docker Installation

            ```bash
            docker pull ghcr.io/decisionrecordsorg/decisionrecords:${{ github.ref_name }}
            ```

            Or use docker-compose:

            ```bash
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.yml
            docker-compose up -d
            ```

            See [Self-Hosting Guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/self-hosting.md) for details.
