# Release workflow
# Triggered on version tags (v*.*.*)
# Builds and publishes Docker images to GitHub Container Registry

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: decisionrecordsorg/decisionrecords

jobs:
  validate:
    name: Validate Community Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Validate release metadata
        run: python scripts/check_release_metadata.py --tag "${GITHUB_REF_NAME}"

      - name: Check open-source artifact boundary
        run: python scripts/check_public_artifacts.py --mode all

      - name: Check Community/Enterprise boundary
        run: python scripts/check_ce_boundary.py

      - name: Check Community image ships every imported module
        run: python scripts/check_ce_image_modules.py

      - name: Run backend tests
        env:
          DECISION_RECORDS_EDITION: community
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: test-secret-key
          FLASK_ENV: testing
          AZURE_KEYVAULT_URL: ""
        run: python -m pytest tests/ -q --tb=short

      - name: Typecheck frontend
        run: |
          cd frontend
          npx tsc -p tsconfig.app.ce.json --noEmit

      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration=community --progress=false

  release:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Gate: build the image for the runner architecture, start it and require
      # it to serve /api/health before any registry login or push happens. It is
      # started on SQLite and again against PostgreSQL with a postgresql:// URL.
      # Nothing below these steps runs if the image cannot boot on either.
      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.community
          push: false
          load: true
          tags: decision-records:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Smoke test release candidate image
        env:
          SMOKE_EXPECT_VERSION_TAG: ${{ github.ref_name }}
        run: |
          SMOKE_EXPECT_VERSION="${SMOKE_EXPECT_VERSION_TAG#v}" \
            scripts/smoke_test_ce_image.sh decision-records:release-candidate

      - name: Smoke test release candidate image against PostgreSQL
        env:
          SMOKE_EXPECT_VERSION_TAG: ${{ github.ref_name }}
          SMOKE_DATABASE: postgres
        run: |
          SMOKE_EXPECT_VERSION="${SMOKE_EXPECT_VERSION_TAG#v}" \
            scripts/smoke_test_ce_image.sh decision-records:release-candidate

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.community
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Docker Installation

            ```bash
            docker pull ghcr.io/decisionrecordsorg/decisionrecords:${{ github.ref_name }}
            ```

            Run it (SQLite data is kept in the `decision-records-data` volume):

            ```bash
            docker run -d --name decision-records -p 3000:8000 \
              -v decision-records-data:/data \
              -e SECRET_KEY="$(openssl rand -hex 32)" \
              -e MASTER_PASSWORD="$(openssl rand -hex 24)" \
              ghcr.io/decisionrecordsorg/decisionrecords:${{ github.ref_name }}
            ```

            Then open http://localhost:3000.

            The `docker-compose.yml` in this repository builds the image from source, so it needs a full checkout of this tag:

            ```bash
            git clone --branch ${{ github.ref_name }} --depth 1 https://github.com/${{ github.repository }}.git
            cd DecisionRecords
            docker compose up -d
            ```

            See [Self-Hosting Guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/self-hosting.md) for details.
