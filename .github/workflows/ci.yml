# Continuous Integration
# Runs on every push and pull request to main branch

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Open-source Artifact Boundary
  public-artifact-check:
    name: Open-source Artifact Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check public artifact boundary
        run: python scripts/check_public_artifacts.py --mode all

  # Community/Enterprise Boundary
  boundary-check:
    name: CE Boundary Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Community/Enterprise boundary
        run: python scripts/check_ce_boundary.py

  # Python Syntax
  python-syntax:
    name: Python Syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python files
        run: |
          python -m py_compile \
            app.py \
            models.py \
            auth.py \
            governance.py \
            notifications.py \
            security.py \
            webauthn_auth.py \
            scripts/check_public_artifacts.py \
            scripts/check_ce_boundary.py \
            scripts/qa_check.py

  # Backend Tests
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        env:
          DECISION_RECORDS_EDITION: community
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: test-secret-key
          FLASK_ENV: testing
        run: |
          python -m pytest tests/ -q --tb=short

  # Frontend Build
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build (Community Edition)
        run: |
          cd frontend
          npm run build -- --configuration=community

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # Docker Build (Community Edition)
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [boundary-check, python-syntax, test-backend, build-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Community Edition
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.community
          push: false
          tags: decision-records:community
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Style lint is advisory until the existing Python style debt is cleaned up.
  lint:
    name: Style Audit (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        continue-on-error: true
        run: |
          flake8 app.py models.py auth.py --max-line-length=120 --ignore=E501,W503

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [public-artifact-check, boundary-check, python-syntax, test-backend, build-frontend, build-docker]
    if: always()

    steps:
      - name: Verify required CI jobs passed
        run: |
          if [ "${{ needs.boundary-check.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.public-artifact-check.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.python-syntax.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.test-backend.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.build-frontend.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.build-docker.result }}" != "success" ]; then exit 1; fi
