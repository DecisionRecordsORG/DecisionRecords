# Continuous Integration
# Runs on every push, pull request, and merge queue entry for main branch

name: CI

run-name: >-
  CI [${{ github.event_name }}] ${{ github.event.pull_request.head.ref || github.ref_name }}

on:
  # Diagnostic only. Required PR checks must come from pull_request or merge_group runs.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  # Keep manual diagnostics from cancelling the canonical pull_request lane.
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  delivery-contract:
    name: Delivery Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch PR base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate delivery contracts
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/check_delivery_contract.py --mode pr --base-ref "refs/remotes/origin/${{ github.base_ref }}" --head-ref HEAD
          else
            python scripts/check_delivery_contract.py --mode repo
          fi

  release-metadata:
    name: Release Metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate release metadata
        run: python scripts/check_release_metadata.py

  # Open-source Artifact Boundary
  public-artifact-check:
    name: Open-source Artifact Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check public artifact boundary
        run: python scripts/check_public_artifacts.py --mode all

  # Community/Enterprise Boundary
  boundary-check:
    name: CE Boundary Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Community/Enterprise boundary
        run: python scripts/check_ce_boundary.py

      - name: Check Community image ships every imported module
        run: python scripts/check_ce_image_modules.py

  private-submodule-lineage:
    name: Private Submodule Lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Fetch PR base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Decide whether private lineage validation is required
        id: lineage
        shell: bash
        run: |
          run_check=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if git diff --quiet "refs/remotes/origin/${{ github.base_ref }}...HEAD" -- ee; then
              run_check=false
            fi
          fi
          echo "run_check=$run_check" >> "$GITHUB_OUTPUT"

      - name: Skip lineage validation when ee is unchanged
        if: steps.lineage.outputs.run_check != 'true'
        run: echo "ee pointer unchanged; skipping private submodule lineage validation."

      - name: Require EE_REPO_TOKEN when lineage validation is in scope
        if: steps.lineage.outputs.run_check == 'true'
        env:
          EE_REPO_TOKEN: ${{ secrets.EE_REPO_TOKEN }}
        run: |
          if [ -z "$EE_REPO_TOKEN" ]; then
            echo "EE_REPO_TOKEN is required to validate ee/marketing lineage when the ee pointer is in scope."
            exit 1
          fi

      - name: Checkout private submodules
        if: steps.lineage.outputs.run_check == 'true'
        env:
          EE_REPO_TOKEN: ${{ secrets.EE_REPO_TOKEN }}
        run: |
          git submodule sync --recursive
          git -c "url.https://x-access-token:${EE_REPO_TOKEN}@github.com/DecisionRecordsORG/.insteadOf=https://github.com/DecisionRecordsORG/" \
            submodule update --init --recursive
          git -C ee -c "url.https://x-access-token:${EE_REPO_TOKEN}@github.com/DecisionRecordsORG/.insteadOf=https://github.com/DecisionRecordsORG/" \
            fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git -C ee/marketing -c "url.https://x-access-token:${EE_REPO_TOKEN}@github.com/DecisionRecordsORG/.insteadOf=https://github.com/DecisionRecordsORG/" \
            fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up Python
        if: steps.lineage.outputs.run_check == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check private submodule lineage
        if: steps.lineage.outputs.run_check == 'true'
        run: |
          python scripts/check_submodule_lineage.py --repo public
          python scripts/check_submodule_lineage.py --repo ee

  # Python Syntax
  python-syntax:
    name: Python Syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile Python files
        run: |
          python -m py_compile \
            app.py \
            models.py \
            auth.py \
            governance.py \
            notifications.py \
            security.py \
            webauthn_auth.py \
            crypto.py \
            decision_relationships.py \
            feature_flags.py \
            migrations.py \
            version.py \
            scripts/check_public_artifacts.py \
            scripts/check_ce_boundary.py \
            scripts/check_ce_image_modules.py \
            scripts/check_delivery_contract.py \
            scripts/delivery_contracts.py \
            scripts/check_release_metadata.py \
            scripts/check_submodule_lineage.py \
            scripts/list_open_obligations.py \
            scripts/qa_check.py

  # Backend Tests
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        env:
          DECISION_RECORDS_EDITION: community
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: test-secret-key
          FLASK_ENV: testing
        run: |
          python -m pytest tests/ -q --tb=short

  # Backend Tests on PostgreSQL
  # The SQLite job above never loads the PostgreSQL driver and does not enforce
  # foreign keys or column types. This job runs the same suite with the shared
  # test fixtures on a real PostgreSQL server, on the interpreter the Community
  # image uses. Tests that load the real app module still use in-memory SQLite;
  # the image smoke test covers the app's own start-up against PostgreSQL.
  test-backend-postgres:
    name: Backend Tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: decisions
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: decisions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U decisions -d decisions_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests against PostgreSQL
        env:
          DECISION_RECORDS_EDITION: community
          DATABASE_URL: sqlite:///test.db
          TEST_DATABASE_URL: postgresql://decisions:ci-test-password@127.0.0.1:5432/decisions_test
          SECRET_KEY: test-secret-key
          FLASK_ENV: testing
        run: |
          python -m pytest tests/ -q --tb=short

  # Frontend Build
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build (Community Edition)
        run: |
          cd frontend
          npm run build -- --configuration=community

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # Docker Build (Community Edition)
  # Building is not enough: the image is started and must answer /api/health.
  # A build never imports the app, so a module missing from the image only
  # shows up when the container runs. It is started twice: on SQLite (the image
  # default) and against a PostgreSQL container with a postgresql:// URL, so a
  # dependency change that breaks the PostgreSQL driver fails here.
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [boundary-check, python-syntax, test-backend, build-frontend]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Community Edition
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.community
          push: false
          load: true
          tags: decision-records:community
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Community image
        run: scripts/smoke_test_ce_image.sh decision-records:community

      - name: Smoke test Community image against PostgreSQL
        env:
          SMOKE_DATABASE: postgres
        run: scripts/smoke_test_ce_image.sh decision-records:community

  # Style lint is advisory until the existing Python style debt is cleaned up.
  lint:
    name: Style Audit (Advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        continue-on-error: true
        run: |
          flake8 app.py models.py auth.py --max-line-length=120 --ignore=E501,W503

  quality-gate:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Quality Gate (Manual)' || 'Quality Gate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [delivery-contract, release-metadata, public-artifact-check, boundary-check, private-submodule-lineage, python-syntax, test-backend, test-backend-postgres, build-frontend, build-docker]
    if: always()

    steps:
      - name: Verify required CI jobs passed
        run: |
          if [ "${{ needs.delivery-contract.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.release-metadata.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.boundary-check.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.public-artifact-check.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.private-submodule-lineage.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.python-syntax.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.test-backend.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.test-backend-postgres.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.build-frontend.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.build-docker.result }}" != "success" ]; then exit 1; fi
