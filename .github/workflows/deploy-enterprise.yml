name: Deploy Enterprise Edition

# Order of the deploy job (do not reorder without reading docs/deployment.md):
#   1. build the image, tagged with the commit SHA only
#   2. pre-flight: import and boot that exact image against PostgreSQL on the runner
#   3. only then log in to Azure, publish, restart the VM and verify
#   4. if production is not healthy afterwards, put the previous image back
# Nothing is pushed and the VM is not touched before the pre-flight has passed.

on:
  workflow_dispatch:
    inputs:
      skip_postgres_preflight:
        description: >-
          Break-glass: skip booting the new image against PostgreSQL before publishing.
          The driver import check and the automatic rollback still run.
        type: boolean
        default: false
      deploy_when_unhealthy:
        description: >-
          Deploy although production does not report healthy beforehand
          (use when this deploy is the fix for an outage).
        type: boolean
        default: false

concurrency:
  group: production-private-app
  cancel-in-progress: false

jobs:
  preflight:
    name: Enterprise Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout private submodules
        env:
          EE_REPO_TOKEN: ${{ secrets.EE_REPO_TOKEN }}
        run: |
          test -n "$EE_REPO_TOKEN"
          git submodule sync --recursive
          git -c "url.https://x-access-token:${EE_REPO_TOKEN}@github.com/DecisionRecordsORG/.insteadOf=https://github.com/DecisionRecordsORG/" \
            submodule update --init --recursive
          git -C ee -c "url.https://x-access-token:${EE_REPO_TOKEN}@github.com/DecisionRecordsORG/.insteadOf=https://github.com/DecisionRecordsORG/" \
            fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git -C ee/marketing -c "url.https://x-access-token:${EE_REPO_TOKEN}@github.com/DecisionRecordsORG/.insteadOf=https://github.com/DecisionRecordsORG/" \
            fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check private submodule lineage
        run: |
          python scripts/check_submodule_lineage.py --repo public
          python scripts/check_submodule_lineage.py --repo ee

      - name: Install Enterprise QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r ee/requirements.txt pytest pytest-cov

      - name: Verify EE submodule checkout
        run: test -d ee

      - name: Check public artifact boundary
        run: python scripts/check_public_artifacts.py --mode all

      - name: Check public CE/EE boundary
        run: python scripts/check_ce_boundary.py

      - name: Compile public Python gateway files
        run: |
          python -m py_compile \
            app.py \
            models.py \
            auth.py \
            governance.py \
            notifications.py \
            security.py \
            webauthn_auth.py \
            scripts/check_public_artifacts.py \
            scripts/check_ce_boundary.py \
            scripts/check_submodule_lineage.py \
            scripts/qa_check.py

      - name: Compile Enterprise Python modules
        run: |
          git -C ee ls-files '*.py' ':!:marketing/*' \
            | sed 's#^#ee/#' \
            | xargs python -m py_compile

      - name: Run Enterprise tests
        env:
          DECISION_RECORDS_EDITION: enterprise
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: test-secret-key
          FLASK_ENV: testing
          AZURE_KEYVAULT_URL: ""
        run: python -m pytest tests/ -q --tb=short

  deploy:
    runs-on: ubuntu-latest
    needs: preflight
    environment: production-private
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      IMAGE_NAME: ${{ vars.AZURE_ENTERPRISE_IMAGE_NAME || 'architecture-decisions' }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      VM_NAME: ${{ vars.AZURE_VM_NAME }}
      HEALTH_URL: ${{ vars.ENTERPRISE_HEALTH_URL || 'https://app.decisionrecords.org/api/health' }}
      # /api/health is a liveness route that answers without a database.
      # /health reports the database, so it is what a deploy is verified with.
      DB_HEALTH_URL: ${{ vars.ENTERPRISE_DB_HEALTH_URL || 'https://app.decisionrecords.org/health' }}

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Checkout private submodules
        env:
          EE_REPO_TOKEN: ${{ secrets.EE_REPO_TOKEN }}
        run: |
          test -n "$EE_REPO_TOKEN"
          git submodule sync --recursive
          git -c "url.https://x-access-token:${EE_REPO_TOKEN}@github.com/DecisionRecordsORG/.insteadOf=https://github.com/DecisionRecordsORG/" \
            submodule update --init --recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate Azure variables
        run: |
          test -n "${{ vars.AZURE_CLIENT_ID }}"
          test -n "${{ vars.AZURE_TENANT_ID }}"
          test -n "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          test -n "$ACR_NAME"
          test -n "$ACR_LOGIN_SERVER"
          test -n "$IMAGE_NAME"
          test -n "$RESOURCE_GROUP"
          test -n "$VM_NAME"

      # ------------------------------------------------------------------
      # Build and pre-flight. No registry or Azure credentials exist yet in
      # this job, so nothing below can publish or deploy until it has passed.
      # ------------------------------------------------------------------
      - name: Build Enterprise image (commit tag only)
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -f ee/deployment/Dockerfile.production \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA" \
            .

      # Needs no database server: creating the engine imports the PostgreSQL
      # driver, which is exactly what failed on 2026-11-21. Always runs.
      - name: Pre-flight - import the app with a PostgreSQL URL
        run: |
          set -euo pipefail
          docker run --rm \
            -e DATABASE_URL=postgresql://preflight:preflight@127.0.0.1:5432/preflight \
            -e SECRET_KEY=preflight-secret-key-0123456789abcdef \
            -e AZURE_KEYVAULT_URL= \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA" \
            python -c "import app; ctx = app.app.app_context(); ctx.push(); print('database driver:', app.db.engine.dialect.name + '/' + app.db.engine.driver)"

      - name: Pre-flight - boot the image against PostgreSQL
        if: ${{ !inputs.skip_postgres_preflight }}
        env:
          SMOKE_PROFILE: enterprise
          SMOKE_DATABASE: postgres
        run: scripts/smoke_test_ce_image.sh "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"

      - name: Warn that the PostgreSQL pre-flight was skipped
        if: ${{ inputs.skip_postgres_preflight }}
        run: echo "::warning title=Pre-flight skipped::skip_postgres_preflight was set. This image was not started against PostgreSQL before being deployed."

      # ------------------------------------------------------------------
      # Publish and deploy.
      # ------------------------------------------------------------------
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      # One script, so the rollback cannot be skipped by a failed step:
      # records the image `latest` points to, pushes the commit tag, moves
      # `latest`, restarts the VM, verifies the database health route, and on
      # any failure after `latest` moved re-points it to the recorded image and
      # restarts again. It exits non-zero unless the new image is serving.
      - name: Publish, deploy to VM and verify (rolls back on failure)
        env:
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_WHEN_UNHEALTHY: ${{ inputs.deploy_when_unhealthy }}
        run: |
          set -euo pipefail
          IMAGE_REPO="$ACR_LOGIN_SERVER/$IMAGE_NAME" scripts/deploy_enterprise_image.sh

      - name: Purge Cloudflare cache
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ZONE_ID" ]; then
            curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
            echo "Cloudflare cache purged"
          else
            echo "Skipping cache purge (missing token or zone id)"
          fi

      - name: Show deployment info
        if: always()
        run: |
          echo "====================================="
          echo "Deploy job status: ${{ job.status }}"
          echo "====================================="
          echo "URL: $HEALTH_URL"
          echo "Database health: $DB_HEALTH_URL"
          echo "Image: $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          echo ""
          echo "To view logs, run:"
          echo "  az vm run-command invoke --resource-group $RESOURCE_GROUP --name $VM_NAME --command-id RunShellScript --scripts 'docker logs adr-app --tail 50'"
