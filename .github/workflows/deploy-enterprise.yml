name: Deploy Enterprise Edition

on:
  workflow_dispatch:

concurrency:
  group: production-private-app
  cancel-in-progress: false

jobs:
  preflight:
    name: Enterprise Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout private submodules
        env:
          EE_REPO_TOKEN: ${{ secrets.EE_REPO_TOKEN }}
        run: |
          test -n "$EE_REPO_TOKEN"
          git submodule sync --recursive
          git -c "url.https://x-access-token:${EE_REPO_TOKEN}@github.com/DecisionRecordsORG/.insteadOf=https://github.com/DecisionRecordsORG/" \
            submodule update --init --recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Enterprise QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r ee/requirements.txt pytest pytest-cov

      - name: Verify EE submodule checkout
        run: test -d ee

      - name: Check public artifact boundary
        run: python scripts/check_public_artifacts.py --mode all

      - name: Check public CE/EE boundary
        run: python scripts/check_ce_boundary.py

      - name: Compile public Python gateway files
        run: |
          python -m py_compile \
            app.py \
            models.py \
            auth.py \
            governance.py \
            notifications.py \
            security.py \
            webauthn_auth.py \
            scripts/check_public_artifacts.py \
            scripts/check_ce_boundary.py \
            scripts/qa_check.py

      - name: Compile Enterprise Python modules
        run: |
          git -C ee ls-files '*.py' ':!:marketing/*' \
            | sed 's#^#ee/#' \
            | xargs python -m py_compile

      - name: Run Enterprise tests
        env:
          DECISION_RECORDS_EDITION: enterprise
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: test-secret-key
          FLASK_ENV: testing
          AZURE_KEYVAULT_URL: ""
        run: python -m pytest tests/ -q --tb=short

  deploy:
    runs-on: ubuntu-latest
    needs: preflight
    environment: production-private
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      IMAGE_NAME: ${{ vars.AZURE_ENTERPRISE_IMAGE_NAME || 'architecture-decisions' }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      VM_NAME: ${{ vars.AZURE_VM_NAME }}
      HEALTH_URL: ${{ vars.ENTERPRISE_HEALTH_URL || 'https://app.decisionrecords.org/api/health' }}

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout private submodules
        env:
          EE_REPO_TOKEN: ${{ secrets.EE_REPO_TOKEN }}
        run: |
          test -n "$EE_REPO_TOKEN"
          git submodule sync --recursive
          git -c "url.https://x-access-token:${EE_REPO_TOKEN}@github.com/DecisionRecordsORG/.insteadOf=https://github.com/DecisionRecordsORG/" \
            submodule update --init --recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Azure variables
        run: |
          test -n "${{ vars.AZURE_CLIENT_ID }}"
          test -n "${{ vars.AZURE_TENANT_ID }}"
          test -n "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          test -n "$ACR_NAME"
          test -n "$ACR_LOGIN_SERVER"
          test -n "$IMAGE_NAME"
          test -n "$RESOURCE_GROUP"
          test -n "$VM_NAME"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 \
            -f ee/deployment/Dockerfile.production \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            .
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"

      - name: Deploy to VM
        run: |
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "docker pull $ACR_LOGIN_SERVER/$IMAGE_NAME:latest && systemctl restart adr-app"

      - name: Wait for health check
        run: |
          echo "Waiting for application to be healthy..."
          # Check the public endpoint directly instead of via VM command
          for i in {1..30}; do
            RESULT=$(curl -sf "$HEALTH_URL" 2>/dev/null || echo "")
            if [[ "$RESULT" == *"ok"* ]] || [[ "$RESULT" == *"healthy"* ]]; then
              echo "Health check response: $RESULT"
              echo "Application is healthy!"
              exit 0
            fi
            echo "Attempt $i/30: Waiting... (response: $RESULT)"
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

      - name: Purge Cloudflare cache
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ZONE_ID" ]; then
            curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
            echo "Cloudflare cache purged"
          else
            echo "Skipping cache purge (missing token or zone id)"
          fi

      - name: Show deployment info
        if: always()
        run: |
          echo "====================================="
          echo "Deployment complete!"
          echo "====================================="
          echo "URL: $HEALTH_URL"
          echo "Image: $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          echo ""
          echo "To view logs, run:"
          echo "  az vm run-command invoke --resource-group $RESOURCE_GROUP --name $VM_NAME --command-id RunShellScript --scripts 'docker logs adr-app --tail 50'"
